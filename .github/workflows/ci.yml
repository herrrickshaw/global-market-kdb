name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      # q is not installed on the runner, so the q-vs-upstream parity tests skip;
      # the harness unit tests and the vendored-oracle checks still run.
      - run: pytest -q
